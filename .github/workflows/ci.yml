name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install -r requirements-poc.txt
      - run: python -m unittest discover -s tests
      - name: Check JavaScript module syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("poc/index.html").read_text()
          match = re.search(r'<script\s+type="module">(.*?)</script>', html, re.DOTALL)
          if not match:
              raise SystemExit("No JavaScript module found in poc/index.html")
          Path("/tmp/city-runner-module.mjs").write_text(match.group(1))
          PY
          node --check /tmp/city-runner-module.mjs
