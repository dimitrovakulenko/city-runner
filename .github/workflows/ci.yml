name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analytics-application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install acceptance dependencies
        run: |
          python -m pip install -r backend/requirements.txt -r scripts/superset/gateway-requirements.txt
          npm ci --prefix apps/web
          npm run build --prefix apps/web
          cd apps/web
          npx playwright install --with-deps chromium
      - name: Start disposable native PostGIS
        run: |
          docker build -f scripts/superset/AcceptancePostgis.Dockerfile -t analytics-acceptance-postgis scripts/superset
          docker run -d --rm --name analytics-acceptance-postgis -e POSTGRES_PASSWORD=disposable-analytics-acceptance -p 55447:5432 analytics-acceptance-postgis
          for attempt in {1..30}; do docker exec analytics-acceptance-postgis pg_isready -U postgres && break; sleep 1; done
      - name: Verify real application authoring and deletion replay
        env:
          SUPERSET_PROBE_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:disposable-analytics-acceptance@127.0.0.1:55447/postgres
          PILOT_BROWSER_CHANNEL: chromium
        run: python scripts/superset/application_acceptance.py --capacity --recovery --output /tmp/analytics-application-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-application-results
          path: /tmp/analytics-application-results
      - name: Remove disposable PostGIS
        if: always()
        run: docker rm -f analytics-acceptance-postgis

  analytics-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPERSET_PROBE_ORIGIN: http://127.0.0.1:18090
      SUPERSET_PROBE_PROJECT: city-runner-superset-upgrade
      PILOT_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Upgrade populated 6.0.0 metadata to pinned 6.1.0
        run: docker compose -p city-runner-superset-upgrade -f scripts/superset/compose.yaml -f scripts/superset/upgrade-compose.yaml up -d --build --wait --wait-timeout 240
      - name: Verify upgraded privacy and browser authoring
        run: |
          mkdir -p /tmp/analytics-upgrade-results
          python scripts/superset/probe.py --output /tmp/analytics-upgrade-results/privacy.json
          node scripts/superset/browser_probe.mjs --output /tmp/analytics-upgrade-results/browser.json
      - name: Collect upgrade diagnostics
        if: always()
        run: |
          mkdir -p /tmp/analytics-upgrade-results
          docker compose -p city-runner-superset-upgrade -f scripts/superset/compose.yaml -f scripts/superset/upgrade-compose.yaml logs --no-color > /tmp/analytics-upgrade-results/containers.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-upgrade-results
          path: /tmp/analytics-upgrade-results
      - name: Remove disposable upgrade project
        if: always()
        run: docker compose -p city-runner-superset-upgrade -f scripts/superset/compose.yaml -f scripts/superset/upgrade-compose.yaml down -v

  superset-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pilot regression dependencies
        run: |
          python -m pip install -r scripts/superset/gateway-requirements.txt
          npm ci --prefix apps/web
      - name: Install browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Verify session and admission concurrency
        run: python -m unittest discover -s scripts/superset -p 'test_*.py' -v
      - name: Start disposable synthetic Superset
        run: docker compose -f scripts/superset/compose.yaml up -d --build --wait --wait-timeout 180
      - name: Verify authoring, privacy and query boundaries
        run: |
          mkdir -p /tmp/superset-pilot-results
          python scripts/superset/probe.py --output /tmp/superset-pilot-results/privacy.json
          PILOT_BROWSER_CHANNEL=chromium node scripts/superset/browser_probe.mjs --output /tmp/superset-pilot-results/browser.json
          python scripts/superset/bounds_probe.py --output /tmp/superset-pilot-results/bounds.json
          docker compose -f scripts/superset/compose.yaml restart superset gateway
          docker compose -f scripts/superset/compose.yaml up -d --no-deps --wait --wait-timeout 60 superset gateway
          python scripts/superset/bounds_probe.py --failure-only --output /tmp/superset-pilot-results/failure.json
          python scripts/superset/bounds_probe.py --provision-only --output /tmp/superset-pilot-results/provisioning.json
      - name: Collect pilot diagnostics
        if: always()
        run: |
          mkdir -p /tmp/superset-pilot-results
          docker compose -f scripts/superset/compose.yaml logs --no-color > /tmp/superset-pilot-results/containers.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: superset-pilot-results
          path: /tmp/superset-pilot-results
      - name: Remove disposable pilot
        if: always()
        run: docker compose -f scripts/superset/compose.yaml down -v

  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.5"
          terraform_wrapper: false
      - name: Check deployment scripts
        run: |
          bash -n scripts/deploy/build-release.sh scripts/deploy/install-hetzner.sh
          shellcheck scripts/deploy/build-release.sh scripts/deploy/install-hetzner.sh
      - name: Validate Hetzner configuration without cloud credentials
        run: |
          terraform -chdir=infra/hetzner fmt -check -recursive
          terraform -chdir=infra/hetzner init -backend=false -lockfile=readonly
          terraform -chdir=infra/hetzner validate

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install -r requirements-poc.txt
      - name: Run PoC tests
        run: python -m unittest discover -s tests -v
      - name: Run SQLite backend tests
        run: python -m unittest discover -s backend/tests
      - name: Check generated mobile API types
        run: python apps/mobile/scripts/generate-api-types.py --check
      - name: Install PostgreSQL and PostGIS
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-postgis
          sudo service postgresql start
          sudo -u postgres createuser --superuser "$USER"
      - name: Run PostGIS integration tests
        run: scripts/dev/postgis-test.sh
      - name: Rehearse account deletion after backup restore
        env:
          POSTGIS_ADMIN_DATABASE_URL: postgresql+psycopg:///postgres
        run: python scripts/dev/account-restore-drill.py --output /tmp/account-restore.json

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run typecheck
        working-directory: apps/mobile
      - run: npm test
        working-directory: apps/mobile

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
